<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Password hash generator</title>
  <meta name="robots" content="noindex" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 4rem auto; padding: 0 1.5rem; color: #1a1a1a; }
    input { font-size: 1rem; padding: 0.5rem; width: 100%; box-sizing: border-box; margin: 0.5rem 0; }
    code { display: block; background: #f2f2f2; padding: 0.75rem; border-radius: 6px; word-break: break-all; margin-top: 1rem; }
    p.hint { color: #666; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Password hash generator</h1>
  <p>Not part of the site itself &mdash; just a helper. Type the password you want to use below, copy the hash it produces, and paste it as <code>PASSWORD_HASH</code> in <code>config.js</code>.</p>
  <input type="text" id="pw" placeholder="Type the password here" autofocus />
  <code id="out">(hash will appear here)</code>
  <p class="hint">This runs entirely in your browser &mdash; the password you type here is never sent anywhere.</p>
  <script>
    const pw = document.getElementById('pw');
    const out = document.getElementById('out');
    async function update() {
      if (!pw.value) { out.textContent = '(hash will appear here)'; return; }
      const bytes = new TextEncoder().encode(pw.value);
      const digest = await crypto.subtle.digest('SHA-256', bytes);
      out.textContent = [...new Uint8Array(digest)].map((b) => b.toString(16).padStart(2, '0')).join('');
    }
    pw.addEventListener('input', update);
  </script>
</body>
</html>
